name: CFA Quant Suite CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test & Invariant Verification (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Core & Testing Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-xdist pytest-asyncio pytest-cov hypothesis
          pip install -e .

      - name: Run Parallel Multi-Core Test Suite (pytest-xdist)
        run: |
          pytest -n auto -v --maxfail=1

      - name: Verify Architecture & Code Contracts
        run: |
          python -c "import cfa_quant; print('✓ cfa_quant v' + cfa_quant.__version__ + ' initialized successfully')"
