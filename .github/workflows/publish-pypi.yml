name: Publish CFA Quantitative Suite to PyPI & Build Artifacts

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test-and-build:
    name: Run Quantitative Invariant Tests & Build Distributions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip build twine pytest pytest-cov hypothesis anyio
          pip install -e .

      - name: Run Test Suite
        run: |
          pytest -v tests/

      - name: Build Go Bubbletea Terminal (cfa-term)
        run: |
          cd cmd/cfa-term
          go build -o ../../bin/cfa-term main.go

      - name: Build Python Wheel and sdist
        run: |
          python -m build

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags')
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine upload dist/*
