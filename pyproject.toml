[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cfa-quant-suite"
version = "2.0.0"
authors = [
  { name="C.B. Winslow", email="cbwinslow@gmail.com" },
]
description = "Institutional CFA Level I/II/III Quantitative Valuation, SAA, Life-Cycle Wealth & Risk Engine"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",
    "yfinance>=0.2.35",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "tabulate>=0.9.0",
    "plotly>=5.18.0",
    "streamlit>=1.30.0",
    "openpyxl>=3.1.2",
    "duckdb>=1.0.0",
    "numpy-financial>=1.0.0",
    "PyPortfolioOpt>=1.5.5",
    "cvxpy>=1.4.0",
    "rich>=13.7.0",
    "textual>=0.50.0",
    "fastembed>=0.2.0",
    "pymupdf>=1.23.0",
    "pypdf>=4.0.0"
]

[project.scripts]
cfa-term = "tui_app:main"
cfa-val = "pipeline.run_valuation:main"

[tool.setuptools]
py-modules = ["tui_app", "app"]

[tool.setuptools.packages.find]
include = ["cfa_quant*", "pipeline*"]
exclude = ["data*", "skills*", "venv*"]
